name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # For the Khronos glTF Validator (scripts/validate-gltf).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Tests
        run: |
          for t in Core Backends Cli; do
            dotnet run --no-build -c Release --project tests/RubberPlant.$t.Tests
          done

      # Renders every example with the CLI and compares with the committed
      # goldens: SVGs byte for byte (identical SVG text means identical pixels in
      # any renderer, stricter than comparing rasterized images), and the SHA-256
      # of every example's OBJ and glTF (golden/mesh-digests.txt).
      - name: Examples match the goldens
        run: bash scripts/check-goldens.sh

      # Every example's .gltf and .glb, and the mesh fixtures, must pass the
      # Khronos glTF Validator without errors.
      - name: glTF output is valid
        run: |
          npm ci --prefix scripts/validate-gltf --no-audit --no-fund
          bash scripts/validate-examples.sh

      # The tests must never write, add or change a golden (untracked and
      # staged files included).
      - name: Goldens untouched
        run: |
          changes=$(git status --porcelain --untracked-files=all -- tests/RubberPlant.Backends.Tests/golden)
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi
