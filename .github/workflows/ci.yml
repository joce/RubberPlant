name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # For the Khronos glTF Validator (scripts/validate-gltf).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install headless OpenGL dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6

      - name: Setup Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Tests
        run: |
          for t in Core Backends Cli; do
            dotnet run --no-build -c Release --project tests/RubberPlant.$t.Tests
          done
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" env LIBGL_ALWAYS_SOFTWARE=1 dotnet run --no-build -c Release --project tests/RubberPlant.Viewer.Tests
          else
            GALLIUM_DRIVER=llvmpipe dotnet run --no-build -c Release --project tests/RubberPlant.Viewer.Tests
          fi

      # Renders every example with the CLI and compares with the committed
      # goldens: SVGs byte for byte (identical SVG text means identical pixels in
      # any renderer, stricter than comparing rasterized images), the SHA-256 of
      # every example's OBJ and glTF (golden/mesh-digests.txt), and the SHA-256
      # of every example's compact `stats` JSON (golden/stats-digests.txt).
      - name: Examples match the goldens
        run: bash scripts/check-goldens.sh

      # The released CLI is a Native AOT build: trimming must not change any
      # output, so it must match the same goldens. Windows only for now.
      - name: Native AOT build matches the goldens
        if: runner.os == 'Windows'
        run: |
          dotnet publish src/RubberPlant.Cli -c Release -r win-x64 --nologo -o aot
          RUBBERPLANT_CLI=aot/rubberplant.exe bash scripts/check-goldens.sh

      # The viewer is also Native AOT compiled and runs headless OpenGL renders
      # under Mesa software rendering on Windows CI.
      - name: Native AOT viewer smoke test
        if: runner.os == 'Windows'
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          dotnet publish src/RubberPlant.Viewer -c Release -r win-x64 --nologo -o aot-viewer
          RUBBERPLANT_VIEWER=aot-viewer/rubberplant-viewer.exe bash scripts/check-viewer-aot.sh

      # Every example's .gltf and .glb, and the mesh fixtures, must pass the
      # Khronos glTF Validator without errors.
      - name: glTF output is valid
        run: |
          npm ci --prefix scripts/validate-gltf --no-audit --no-fund
          bash scripts/validate-examples.sh

      # The tests must never write, add or change a golden (untracked and
      # staged files included).
      - name: Goldens untouched
        run: |
          changes=$(git status --porcelain --untracked-files=all -- tests/RubberPlant.Backends.Tests/golden)
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi
